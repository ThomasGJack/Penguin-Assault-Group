<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guide d'habillement PAG</title>
<style>
:root{color-scheme:dark;--bg:#12150f;--panel:#1a1f17;--panel2:#20261c;--line:#2f3728;--ink:#e9ebe4;--mute:#97a08c;--acc:#c9a227;
--impose:#c9a227;--choix:#6fa3c7;--perso:#6fb27f;--interdit:#c0564b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding-inline:20px;padding-block:36px 80px}
.wrap{max-width:1000px;margin:0 auto}
.eyebrow{margin:0;color:var(--acc);text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:600}
h1{font:700 34px/1.15 Georgia,"Times New Roman",serif;margin:6px 0 12px;text-wrap:balance}
.lead{color:var(--mute);max-width:62ch;margin:0;font-size:16px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding-block:12px;margin-block:22px 8px;border-bottom:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px}
nav a:hover{border-color:var(--acc);color:var(--acc)}
h2{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.regles{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:18px 22px;margin-top:18px}
.regles ol{margin:10px 0 0;padding-left:20px}.regles li{margin-block:6px}
.legende{display:flex;gap:8px;flex-wrap:wrap;margin-block:18px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.impose{color:var(--impose)}.tag.choix{color:var(--choix)}.tag.perso{color:var(--perso)}.tag.interdit{color:var(--interdit)}
.tenue{margin-top:34px;scroll-margin-top:70px}
.quand{color:var(--mute);margin:0 0 14px;max-width:70ch}
.ligne{display:grid;grid-template-columns:170px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:8px}
.ligne.impose{border-left-color:var(--impose)}.ligne.choix{border-left-color:var(--choix)}.ligne.perso{border-left-color:var(--perso)}.ligne.interdit{border-left-color:var(--interdit)}
.slot{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.slot strong{font-size:15px}
.note{margin:0 0 8px;color:var(--mute);font-size:14px}
.pieces,.berets{display:flex;flex-wrap:wrap;gap:8px}
figure{margin:0;width:112px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
figure img{display:block;width:100%;height:auto;border-radius:4px}
figcaption{font-size:11.5px;line-height:1.25;color:var(--ink);margin-top:4px;overflow-wrap:anywhere}
.berets figure{width:128px}.berets figcaption{font-size:12.5px}
.interdits ul{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--interdit);border-radius:8px;margin:12px 0 0;padding:16px 22px 16px 38px}
.interdits li{margin-block:6px}
@media(max-width:640px){.ligne{grid-template-columns:1fr;gap:8px}.slot{flex-direction:row;align-items:center;justify-content:space-between}h1{font-size:27px}figure{width:calc(33.3% - 6px)}.berets figure{width:calc(50% - 4px)}}
@media print{body{background:#fff;color:#000}nav{display:none}}
.sigle{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.1em;color:var(--bg);background:var(--acc);padding:4px 8px;border-radius:4px}
.navt{align-self:center;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-inline:6px 2px}
header.partie{margin-top:70px;padding-top:34px;border-top:1px solid var(--line)}
nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
nav a,.navt{flex:0 0 auto;white-space:nowrap}
</style></head><body><div class="wrap">
